name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Package Extension ZIP
        run: |
          mkdir -p dist/staging
          cp -r manifest.json newtab.html newtab.css newtab.js background.js popup.html popup.js assets dist/staging/
          cd dist/staging && zip -r ../HookTab-${{ github.ref_name || 'latest' }}.zip ./*
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
